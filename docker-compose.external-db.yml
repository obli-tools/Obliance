# Use this compose file if you already have PostgreSQL running (e.g. on Unraid).
# Usage: docker compose -f docker-compose.external-db.yml up -d
#
# Required .env variables:
#   DATABASE_URL=postgres://obliance:<password>@<host>:5432/obliance
#   SESSION_SECRET=<random-string>

services:
  server:
    image: meejay/obliance-server:${OBLIANCE_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?set it in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set it in .env to 32+ random characters}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      # Public URL of this instance (e-mail links, trusted SSO origin) — see .env.example
      APP_URL: ${APP_URL:-}
      # Initial administrator — empty password: a random one, printed once in
      # the server logs. See .env.example.
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      # SSH bastion (off by default) — see .env.example
      SSH_BASTION_ENABLED: ${SSH_BASTION_ENABLED:-false}
      SSH_BASTION_PORT: ${SSH_BASTION_PORT:-2222}
      # Device-bound 2FA (fingerprint validation from the Android app) — see .env.example
      DEVICE_KEYS_DISABLED: ${DEVICE_KEYS_DISABLED:-false}
      DEVICE_KEY_ORIGINS: ${DEVICE_KEY_ORIGINS:-}
      DEVICE_KEY_APP_IDS: ${DEVICE_KEY_APP_IDS:-}
      DEVICE_KEY_APP_SIGNERS: ${DEVICE_KEY_APP_SIGNERS:-}
      DEVICE_KEY_BINDING_SECRET: ${DEVICE_KEY_BINDING_SECRET:-}
      SCRIPT_PARAMS_SECRET: ${SCRIPT_PARAMS_SECRET:-}
      DEVICE_KEYS_SSO_ENABLED: ${DEVICE_KEYS_SSO_ENABLED:-false}
      # Obligate: optional distinct inbound secret (empty = Settings value / the API key) — see .env.example
      OBLIGATE_INBOUND_SECRET: ${OBLIGATE_INBOUND_SECRET:-}
      # Delegated reads from sibling apps (empty = oblidesk only, platform-admin subjects refused) — see .env.example
      OBLIGATE_DELEGATION_APPS: ${OBLIGATE_DELEGATION_APPS:-}
      OBLIGATE_DELEGATION_ALLOW_ADMIN: ${OBLIGATE_DELEGATION_ALLOW_ADMIN:-}
    # SSH bastion: uncomment to publish its port once SSH_BASTION_ENABLED=true.
    # Publish it DIRECTLY (no TCP proxy in front): the bastion must see the real
    # client IP, or the IP allow-list / bans / 3-strike rule become meaningless.
    #ports:
    #  - "${SSH_BASTION_PORT:-2222}:${SSH_BASTION_PORT:-2222}"
    volumes:
      # Persistent custom directory: scripts, SSH keys, etc.
      # SSH keys: chmod 700 custom/.ssh && chmod 600 custom/.ssh/id_*
      - ${CUSTOM_DIR:-./custom}:/custom

  client:
    image: meejay/obliance-client:${OBLIANCE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${LISTEN_PORT:-3000}:80"
